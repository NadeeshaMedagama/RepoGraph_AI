# ═══════════════════════════════════════════════════════════════════════════════
# RepoGraph AI - Main CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
# Comprehensive CI/CD pipeline for building, testing, and deploying
# Triggers on push to master and pull requests
# ═══════════════════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  DOCKER_REGISTRY: gcr.io
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: repograph-ai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Code Quality & Linting
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint

      - name: 🎨 Check code formatting (Black)
        run: |
          black --check --diff .
        continue-on-error: true

      - name: 📋 Check import sorting (isort)
        run: |
          isort --check-only --diff .
        continue-on-error: true

      - name: 🔎 Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --statistics

      - name: 📊 Type checking with mypy
        run: |
          mypy --install-types --non-interactive .
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Unit & Integration Tests
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 poppler-utils

      - name: 🧪 Run tests with coverage
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --junitxml=test-results.xml
        continue-on-error: true

      - name: 📊 Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: 📤 Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            htmlcov/

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 3: Security Scanning
  # ═══════════════════════════════════════════════════════════════════════════
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit pip-audit

      - name: 🔍 Check dependencies for vulnerabilities (Safety)
        run: |
          pip install -r requirements.txt
          safety check --full-report
        continue-on-error: true

      - name: 🔍 Audit dependencies (pip-audit)
        run: |
          pip-audit -r requirements.txt
        continue-on-error: true

      - name: 🔐 Security scan with Bandit
        run: |
          bandit -r . -f json -o bandit-report.json --exclude .venv,tests
        continue-on-error: true

      - name: 📤 Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            bandit-report.json

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 4: Build Docker Image
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔍 Check GCP secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "GCP secrets not configured. Skipping GCP operations."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Authenticate to Google Cloud
        if: steps.check_secrets.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🔑 Configure Docker for GCR
        if: steps.check_secrets.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: 🏷️ Extract metadata for Docker (with GCP)
        if: steps.check_secrets.outputs.skip != 'true'
        id: meta-gcp
        uses: docker/metadata-action@v6
        with:
          images: |
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: 🏗️ Build and push Docker image (with GCP)
        if: steps.check_secrets.outputs.skip != 'true' && github.event_name != 'pull_request'
        id: build-gcp
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-gcp.outputs.tags }}
          labels: ${{ steps.meta-gcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 🏗️ Build Docker image only (without GCP)
        if: steps.check_secrets.outputs.skip == 'true' || github.event_name == 'pull_request'
        id: build-local
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.SERVICE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 🔍 Scan Docker image for vulnerabilities
        if: steps.check_secrets.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 5: Deploy to Staging (Google Cloud Run)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.environment == 'staging' }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔍 Check GCP secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "⚠️ GCP secrets not configured. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ GCP secrets configured. Proceeding with deployment."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔐 Authenticate to Google Cloud
        if: steps.check_secrets.outputs.skip != 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Set up Cloud SDK
        if: steps.check_secrets.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: 🚀 Deploy to Cloud Run (Staging)
        if: steps.check_secrets.outputs.skip != 'true'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}-staging
          region: ${{ env.GCP_REGION }}
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=2Gi
            --cpu=2
            --min-instances=0
            --max-instances=5
            --port=8000
            --timeout=300
          env_vars: |
            AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }}
            AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}
            AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT=${{ secrets.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
            AZURE_OPENAI_CHAT_DEPLOYMENT=${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
            PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
            PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}-staging
            LOG_LEVEL=DEBUG

      - name: 🧪 Run smoke tests
        if: steps.check_secrets.outputs.skip != 'true'
        run: |
          echo "Running smoke tests against ${{ steps.deploy.outputs.url }}"
          curl -f "${{ steps.deploy.outputs.url }}/health" || exit 1

      - name: 📢 Notify deployment
        if: steps.check_secrets.outputs.skip != 'true'
        run: |
          echo "✅ Staging deployment completed: ${{ steps.deploy.outputs.url }}"

      - name: ⚠️ Skipped deployment notice
        if: steps.check_secrets.outputs.skip == 'true'
        run: |
          echo "⚠️ Staging deployment skipped - GCP secrets not configured"

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 6: Deploy to Production (Google Cloud Run)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔍 Check GCP secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY_PROD }}" ] || [ -z "${{ secrets.GCP_PROJECT_ID_PROD }}" ]; then
            echo "⚠️ GCP production secrets not configured. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ GCP production secrets configured. Proceeding with deployment."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔐 Authenticate to Google Cloud
        if: steps.check_secrets.outputs.skip != 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: ☁️ Set up Cloud SDK
        if: steps.check_secrets.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID_PROD }}

      - name: 🚀 Deploy to Cloud Run (Production)
        if: steps.check_secrets.outputs.skip != 'true'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=4Gi
            --cpu=4
            --min-instances=1
            --max-instances=20
            --port=8000
            --timeout=300
            --concurrency=80
          env_vars: |
            AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY_PROD }}
            AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT_PROD }}
            AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT=${{ secrets.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
            AZURE_OPENAI_CHAT_DEPLOYMENT=${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
            PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY_PROD }}
            PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}
            LOG_LEVEL=WARNING

      - name: 🧪 Run production smoke tests
        if: steps.check_secrets.outputs.skip != 'true'
        run: |
          echo "Running production smoke tests against ${{ steps.deploy.outputs.url }}"
          curl -f "${{ steps.deploy.outputs.url }}/health" || exit 1
          curl -f "${{ steps.deploy.outputs.url }}/stats" || exit 1

      - name: 📢 Notify production deployment
        if: steps.check_secrets.outputs.skip != 'true'
        run: |
          echo "✅ Production deployment completed: ${{ steps.deploy.outputs.url }}"

      - name: ⚠️ Skipped deployment notice
        if: steps.check_secrets.outputs.skip == 'true'
        run: |
          echo "⚠️ Production deployment skipped - GCP secrets not configured"

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 7: Create Release
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📝 Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        continue-on-error: true

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 RepoGraph AI ${{ github.ref_name }}
            
            ### What's Changed
            ${{ steps.changelog.outputs.content }}
            
            ### Docker Image
            ```
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.ref_name }}
            ```
            
            ### Deployment
            This release has been automatically deployed to production.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
