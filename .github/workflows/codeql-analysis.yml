# ═══════════════════════════════════════════════════════════════════════════════
# RepoGraph AI - CodeQL Security Analysis
# ═══════════════════════════════════════════════════════════════════════════════
# Advanced security scanning using GitHub CodeQL
# Runs on push, pull requests, and weekly schedule
# ═══════════════════════════════════════════════════════════════════════════════

name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # CodeQL Analysis
  # ═══════════════════════════════════════════════════════════════════════════
  analyze:
    name: 🔍 CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - python

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          # Custom queries can be added here
          # queries: ./path/to/custom-queries

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          output: codeql-results

      - name: 📤 Upload CodeQL results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Dependency Review (for PRs)
  # ═══════════════════════════════════════════════════════════════════════════
  dependency-review:
    name: 📋 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC

  # ═══════════════════════════════════════════════════════════════════════════
  # Secret Scanning
  # ═══════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: 🔍 Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # SAST (Static Application Security Testing)
  # ═══════════════════════════════════════════════════════════════════════════
  sast:
    name: 🛡️ SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: 🔐 Run Bandit security scan
        run: |
          bandit -r . -f sarif -o bandit-results.sarif --exclude .venv,tests,.github
        continue-on-error: true

      - name: 📤 Upload Bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        continue-on-error: true

      - name: 🔍 Run Semgrep security scan
        run: |
          semgrep --config=auto --sarif --output=semgrep-results.sarif .
        continue-on-error: true

      - name: 📤 Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        continue-on-error: true
