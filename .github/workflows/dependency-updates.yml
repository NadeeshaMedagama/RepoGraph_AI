# ═══════════════════════════════════════════════════════════════════════════════
# RepoGraph AI - Dependency Updates (Dependabot Alternative)
# ═══════════════════════════════════════════════════════════════════════════════
# Automated dependency updates using Renovate-style workflow
# Runs daily and on-demand
# ═══════════════════════════════════════════════════════════════════════════════

name: Dependency Updates

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - security
          - minor
          - major

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Check for Updates
  # ═══════════════════════════════════════════════════════════════════════════
  check-updates:
    name: 🔄 Check for Updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      updates_json: ${{ steps.check.outputs.updates_json }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools pip-audit safety

      - name: 🔍 Check for outdated packages
        id: check
        run: |
          pip install -r requirements.txt
          
          # Get outdated packages
          pip list --outdated --format=json > outdated.json
          
          # Check if there are updates
          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "[]" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "updates_json=$(cat outdated.json)" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "updates_json=[]" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Display outdated packages
        run: |
          echo "📦 Outdated packages:"
          cat outdated.json | python -m json.tool

      - name: 📤 Upload outdated packages report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-packages
          path: outdated.json

  # ═══════════════════════════════════════════════════════════════════════════
  # Security Updates (Priority)
  # ═══════════════════════════════════════════════════════════════════════════
  security-updates:
    name: 🔒 Security Updates
    runs-on: ubuntu-latest
    needs: check-updates
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      - name: 🔍 Check for security vulnerabilities
        id: audit
        run: |
          pip install -r requirements.txt
          
          # Run pip-audit and capture output
          pip-audit -r requirements.txt --format json > security-audit.json 2>&1 || true
          
          # Check if vulnerabilities found
          if [ -s security-audit.json ]; then
            VULN_COUNT=$(cat security-audit.json | python -c "import sys,json; data=json.load(sys.stdin); print(len(data.get('dependencies', [])))" 2>/dev/null || echo "0")
            echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          else
            echo "vuln_count=0" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Auto-fix security vulnerabilities
        if: steps.audit.outputs.vuln_count != '0'
        run: |
          # Try to upgrade vulnerable packages
          pip-audit -r requirements.txt --fix 2>&1 || true
          
          # Regenerate requirements
          pip freeze > requirements-updated.txt
          
          # Check if there are changes
          if ! diff -q requirements.txt requirements-updated.txt > /dev/null 2>&1; then
            mv requirements-updated.txt requirements.txt
            echo "SECURITY_UPDATES=true" >> $GITHUB_ENV
          fi

      - name: 📝 Create security update PR
        if: env.SECURITY_UPDATES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: '🔒 Security: Update vulnerable dependencies'
          title: '🔒 Security Update: Fix vulnerable dependencies'
          body: |
            ## 🔒 Security Update
            
            This PR automatically updates dependencies with known security vulnerabilities.
            
            ### Changes
            - Updated vulnerable packages to secure versions
            
            ### Audit Report
            See the workflow run for detailed vulnerability information.
            
            ---
            *This PR was automatically created by the Dependency Updates workflow.*
          branch: security-updates
          labels: |
            security
            dependencies
            automated

  # ═══════════════════════════════════════════════════════════════════════════
  # Regular Updates
  # ═══════════════════════════════════════════════════════════════════════════
  regular-updates:
    name: 📦 Regular Updates
    runs-on: ubuntu-latest
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install current dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Update dependencies
        id: update
        run: |
          # Create backup
          cp requirements.txt requirements.txt.bak
          
          # Update all packages
          pip install --upgrade $(pip list --outdated --format=freeze | cut -d= -f1)
          
          # Generate new requirements
          pip freeze > requirements-new.txt
          
          # Check for changes
          if ! diff -q requirements.txt.bak requirements-new.txt > /dev/null 2>&1; then
            mv requirements-new.txt requirements.txt
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            
            # Generate changelog
            echo "## Updated Packages" > update-changelog.md
            diff requirements.txt.bak requirements.txt | grep "^>" | sed 's/^> /- /' >> update-changelog.md || true
          fi

      - name: 🧪 Test updated dependencies
        if: env.HAS_CHANGES == 'true'
        run: |
          pip install pytest
          pytest tests/ -v --tb=short || echo "Some tests failed, review required"
        continue-on-error: true

      - name: 📝 Create dependency update PR
        if: env.HAS_CHANGES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: '📦 Update dependencies'
          title: '📦 Dependency Update: Weekly package updates'
          body: |
            ## 📦 Dependency Update
            
            This PR updates project dependencies to their latest compatible versions.
            
            ### Changes
            ${{ env.UPDATE_CHANGELOG }}
            
            ### Testing
            - [ ] Unit tests pass
            - [ ] Integration tests pass
            - [ ] Manual verification completed
            
            ---
            *This PR was automatically created by the Dependency Updates workflow.*
          branch: dependency-updates
          labels: |
            dependencies
            automated
          reviewers: |
            ${{ github.repository_owner }}
