# ═══════════════════════════════════════════════════════════════════════════════
# RepoGraph AI - Docker Build & Test
# ═══════════════════════════════════════════════════════════════════════════════
# Dedicated workflow for Docker image building and testing
# ═══════════════════════════════════════════════════════════════════════════════

name: Docker Build & Test

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - '**.py'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - '**.py'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: gcr.io
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_NAME: repograph-ai

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Dockerfile Linting
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 📋 Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔍 Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013

      - name: 📋 Validate docker-compose
        run: |
          docker compose -f docker-compose.yml config --quiet

  # ═══════════════════════════════════════════════════════════════════════════
  # Build Docker Image
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=,format=short
            type=raw,value=test-${{ github.run_number }}

      - name: 🏗️ Build Docker image (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 📊 Display image info
        run: |
          docker images ${{ env.IMAGE_NAME }}:test
          docker inspect ${{ env.IMAGE_NAME }}:test --format='{{.Size}}' | numfmt --to=iec

      - name: 💾 Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }}:test -o docker-image.tar

      - name: 📤 Upload Docker image artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # Test Docker Image
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Test Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📥 Download Docker image artifact
        uses: actions/download-artifact@v7
        with:
          name: docker-image

      - name: 📦 Load Docker image
        run: |
          docker load -i docker-image.tar

      - name: 🧪 Test container startup
        run: |
          # Run container in background
          docker run -d --name test-container \
            -e AZURE_OPENAI_API_KEY=test_key \
            -e AZURE_OPENAI_ENDPOINT=https://test.openai.azure.com/ \
            -e PINECONE_API_KEY=test_key \
            -e PINECONE_INDEX_NAME=test-index \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:test \
            uvicorn api:app --host 0.0.0.0 --port 8000
          
          # Wait for container to start
          sleep 10
          
          # Check container is running
          docker ps -a
          docker logs test-container

      - name: 🔍 Test health endpoint
        run: |
          # Try to connect (may fail due to missing real API keys)
          curl -s http://localhost:8000/ || true
          curl -s http://localhost:8000/health || true

      - name: 🧪 Test CLI commands
        run: |
          # Test help commands
          docker run --rm ${{ env.IMAGE_NAME }}:test python main.py --help
          docker run --rm ${{ env.IMAGE_NAME }}:test python query.py --help

      - name: 🧪 Test Python imports
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test python -c "
          from config import get_settings
          from services import DocumentScanner, ContentExtractor
          from workflows import create_workflow
          from models import Document, Chunk
          print('✅ All imports successful')
          "

      - name: 🧹 Cleanup
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true

  # ═══════════════════════════════════════════════════════════════════════════
  # Security Scan
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 Download Docker image artifact
        uses: actions/download-artifact@v7
        with:
          name: docker-image

      - name: 📦 Load Docker image
        run: |
          docker load -i docker-image.tar

      - name: 🔍 Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 🔍 Scan with Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: 🔍 Scan with Grype
        uses: anchore/scan-action@v7
        with:
          image: '${{ env.IMAGE_NAME }}:test'
          fail-build: false
          severity-cutoff: high

  # ═══════════════════════════════════════════════════════════════════════════
  # Push to Registry (only on main/develop)
  # ═══════════════════════════════════════════════════════════════════════════
  push:
    name: 📤 Push to Registry
    runs-on: ubuntu-latest
    needs: [build, test, security-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🔑 Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 📊 Display pushed tags
        run: |
          echo "📦 Pushed tags:"
          echo "${{ steps.meta.outputs.tags }}"
