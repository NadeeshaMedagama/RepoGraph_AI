      #     payload: |
      #       {
      #         "text": "🚀 RepoGraph AI v${{ needs.validate.outputs.version }} released!",
      #         "blocks": [
      #           {
      #             "type": "section",
      #             "text": {
      #               "type": "mrkdwn",
      #               "text": "🚀 *RepoGraph AI v${{ needs.validate.outputs.version }}* has been released!\n\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.validate.outputs.version }}|View Release>"
