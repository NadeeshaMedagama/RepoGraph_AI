# ═══════════════════════════════════════════════════════════════════════════════
# RepoGraph AI - Git Cliff Configuration (Changelog Generator)
# ═══════════════════════════════════════════════════════════════════════════════
# Configuration for automatic changelog generation
# ═══════════════════════════════════════════════════════════════════════════════

[changelog]
header = """
# Changelog

All notable changes to RepoGraph AI will be documented in this file.

"""

body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""

footer = """
---
*Generated with [git-cliff](https://github.com/orhun/git-cliff)*
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/issues/${1}))" },
]
commit_parsers = [
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^doc", group = "📚 Documentation" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "♻️ Refactoring" },
    { message = "^style", group = "🎨 Styling" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "📦 Dependencies" },
    { message = "^chore", group = "🔧 Maintenance" },
    { message = "^ci", group = "👷 CI/CD" },
    { message = "^build", group = "🏗️ Build" },
    { body = ".*security", group = "🔒 Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "nadeeshame"
repo = "repograph-ai"
